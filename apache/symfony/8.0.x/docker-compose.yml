name: symfony8
services: 
  db:
    image: mariadb:11.8.5
    container_name: symfony8-mysql
    restart: unless-stopped
    ports: ['3306:3306']
    volumes:
      # - db_data:/var/lib/mysql
      - './mysql_data:/var/lib/mysql'
    environment:
      MYSQL_DATABASE: db_test
      MYSQL_USER: user 
      MYSQL_PASSWORD: secret
      MYSQL_ALLOW_EMPTY_PASSWORD: 'no'
      MYSQL_ROOT_PASSWORD: root

  web:
    # image: "php:8.4-apache"
    container_name: symfony8-apache2
    build: 
      context: .
      dockerfile: apache.dockerfile
    restart: unless-stopped
    depends_on: ['db']
    ports: ['8000:80']
    links: ['db:db']
    volumes:
      - './src/:/var/www/html'
    environment:
      MYSQL_DB_HOST: db
      MYSQL_DATABASE: db_test
      MYSQL_USER: user 
      MYSQL_PASSWORD: secret

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2
    container_name: symfony8-phpmyadmin
    restart: unless-stopped
    depends_on: ['db']
    ports: ['1200:80']
    links: ['db:db']
    environment:
      - MYSQL_DB_HOST=db
      - MYSQL_USER=user 
      - MYSQL_PASSWORD=secret

